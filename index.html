<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chân phước Fulton Sheen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
  /* Tối giản, trang trọng: nền kem, chữ nâu. Một giao diện sáng duy nhất (có chủ ý). */
  :root{
    color-scheme: light;
    --cream:#f6f0e4;
    --cream-2:#efe6d5;
    --rule:#d9ccb4;
    --brown:#3d2b1f;
    --brown-2:#6e5642;
    --accent:#8b5e3c;
    --rule-strong:#b8a283; /* vạch phân cách gallery */
    --fuchsia-tint:#f2dde3; /* sắc áo Giám mục, rất nhạt */
    --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --body:"Source Serif 4", Georgia, serif;
  }
  html{background:var(--cream)}
  body{background:var(--cream);min-height:100vh;margin:0;color:var(--brown);font:17px/1.7 var(--body);padding-inline:16px}
  body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:38vh;z-index:0;pointer-events:none;
    background:linear-gradient(to bottom,transparent,var(--fuchsia-tint))}
  .wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding-block:20px 72px}
  a{color:var(--accent);text-underline-offset:3px}
  :focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
  .small{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--brown-2)}

  .draftbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--brown-2);border-bottom:1px dashed var(--rule);padding-bottom:10px}
  .draftbar .toggle{display:flex;gap:4px}
  .draftbar button{font:inherit;color:var(--brown-2);background:transparent;border:1px solid var(--rule);border-radius:4px;padding:3px 10px;cursor:pointer}
  .draftbar button[aria-pressed="true"]{background:var(--brown);color:var(--cream);border-color:var(--brown)}

  /* HERO */
  .hero{padding-block:64px 48px;text-align:center}
  .cross{display:block;margin:0 auto 18px;width:14px;height:22px;color:var(--accent)}
  .portrait{position:relative;width:min(280px,72vw);aspect-ratio:532/629;max-width:100%;margin:0 auto 4px}
  .portrait .frame{position:absolute;left:9%;right:9%;top:20%;bottom:18%;border-radius:999px 999px 6px 6px;
    border:1px solid var(--rule);background:var(--cream-2);box-shadow:inset 0 0 0 7px var(--cream),inset 0 0 0 8px var(--rule);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--brown-2);text-align:center}
  .portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 100%;
    -webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,#000 80%,transparent 100%)}
  .portrait svg{width:56px;height:56px;opacity:.5}
  .portrait .ph{font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding-inline:16px}
  .caption{font-size:13px;font-style:italic;color:var(--brown-2);margin:-18px 0 24px}
  h1{font:500 clamp(40px,7vw,64px)/1.05 var(--display);margin:.25em 0 .2em;text-wrap:balance}
  h1 em{font-style:italic}
  .sub{color:var(--brown-2);max-width:52ch;margin:0 auto}

  .clock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:40px auto 0;max-width:520px;border-block:1px solid var(--rule)}
  .unit{padding-block:14px}
  .unit + .unit{border-left:1px solid var(--rule)}
  .num{font:500 clamp(36px,7.5vw,56px)/1 var(--display);font-variant-numeric:tabular-nums lining-nums}
  .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--brown-2);margin-top:4px}
  .since{margin:40px auto 0;max-width:520px;border-block:1px solid var(--rule);padding-block:16px}
  .since .num{font-size:clamp(56px,10vw,84px)}
  .date-note{font-size:14px;font-style:italic;color:var(--brown-2);margin-top:18px}

  .ctas{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:32px}
  .cta{text-decoration:none;font-size:15px;letter-spacing:.06em;padding:11px 22px;border:1px solid var(--brown);border-radius:6px;color:var(--brown)}
  .cta.primary{background:var(--brown);color:var(--cream)}
  .cta:hover{background:var(--accent);border-color:var(--accent);color:var(--cream)}

  /* SECTIONS */
  section{padding-block:56px;border-top:1px solid var(--rule)}
  .head{text-align:center;margin-bottom:32px}
  h2{font:500 clamp(30px,5vw,40px)/1.15 var(--display);margin:6px 0 8px}
  .lead{color:var(--brown-2);margin:0 auto;max-width:56ch}

  /* Gallery thành tựu: lưới -> dòng thời gian khi chọn một ô */
  .g-bar{display:flex;justify-content:flex-end;min-height:34px;margin-bottom:8px}
  .g-back{font:14px var(--body);color:var(--brown);background:transparent;border:1px solid var(--rule);border-radius:6px;padding:5px 14px;cursor:pointer}
  .g-back:hover{border-color:var(--brown)}
  .gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:transparent;border:1px solid var(--rule-strong);border-radius:8px;overflow:hidden}
  .item{border-radius:0}
  .gallery.focus{gap:1px;background:var(--rule-strong);border-color:var(--rule-strong)}
  .gallery.focus .item{border-radius:0}
  .item{font:inherit;color:inherit;text-align:left;background:var(--cream);border:0;margin:0;padding:22px 20px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-height:180px;min-width:0;overflow:hidden}
  .item:hover{background:var(--cream-2)}
  .item .year{font:500 30px/1 var(--display);color:var(--accent);font-variant-numeric:lining-nums;transition:font-size .3s}
  .item .t{display:block;font:600 16px/1.35 var(--body)}
  .item .short{display:block;font-size:14.5px;line-height:1.55;color:var(--brown-2)}
  .item .detail{display:none}
  .item .detail p{margin:0 0 16px;max-width:62ch;color:var(--brown)}
  .item .detail p:last-child{margin-bottom:0}

  .gallery.focus{display:flex;height:min(560px,78vh)}
  .gallery.focus .item{flex:0 0 58px;min-height:0;padding:22px 0;align-items:center;transition:flex-basis .35s ease,background .2s}
  .gallery.focus .item:not(.active) .t,.gallery.focus .item:not(.active) .short{display:none}
  .gallery.focus .item:not(.active) .year{font-size:17px;writing-mode:vertical-rl;transform:rotate(180deg)}
  .gallery.focus .item.active{flex:1 1 0;padding:30px 0 0 32px;align-items:stretch;background:var(--cream-2);cursor:default}
  .gallery.focus .item.active > .year,.gallery.focus .item.active > .t,.gallery.focus .item.active > .short{padding-right:32px}
  .gallery.focus .item.active .year{font-size:44px}
  .gallery.focus .item.active .t{font:500 28px/1.2 var(--display)}
  .gallery.focus .item.active .detail{display:block;flex:1 1 auto;min-height:0;overflow-y:auto;font-size:16px;line-height:1.75;padding:14px 32px 36px 0;margin-top:6px;border-top:1px solid var(--rule);
    -webkit-mask-image:linear-gradient(to bottom,#000 88%,transparent);mask-image:linear-gradient(to bottom,#000 88%,transparent)}
  .gallery.focus .item.active .detail{scrollbar-width:none}
  .gallery.focus .item.active .detail::-webkit-scrollbar{display:none}
  .scroll-hint{display:none;align-self:flex-start;align-items:center;gap:8px;margin:6px 0 14px;padding:4px 0;background:none;border:0;
    font:12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--brown-2);cursor:pointer;transition:opacity .25s}
  .scroll-hint:hover{color:var(--brown)}
  .scroll-hint svg{width:14px;height:14px}
  @media (prefers-reduced-motion:no-preference){.scroll-hint svg{animation:nudge 1.8s ease-in-out infinite}}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
  .scroll-hint.done{opacity:0;pointer-events:none}
  .gallery.focus .item.active .scroll-hint{display:inline-flex}
  @media (max-width:760px){
    .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
    .gallery.focus{flex-direction:column;height:auto}
    .gallery.focus .item{flex:0 0 auto;flex-direction:row;align-items:baseline;gap:14px;padding:12px 18px}
    .gallery.focus .item:not(.active) .year{writing-mode:horizontal-tb;transform:none;font-size:20px;min-width:52px}
    .gallery.focus .item:not(.active) .t{display:block;font-size:15px}
    .gallery.focus .item.active{flex:0 0 auto;flex-direction:column;align-items:stretch;gap:8px;padding:24px 20px}
    .gallery.focus .item.active > .year,.gallery.focus .item.active > .t,.gallery.focus .item.active > .short{padding-right:0}
    .gallery.focus .item.active .detail{overflow:visible;padding-right:0;padding-bottom:4px;-webkit-mask-image:none;mask-image:none}
    .gallery.focus .item.active .scroll-hint{display:none}
  }
  @media (prefers-reduced-motion:reduce){.gallery.focus .item,.item .year{transition:none}}

  .teachings{display:grid;gap:36px;max-width:640px;margin:0 auto}
  .teach{text-align:center}
  .teach blockquote{margin:0;font:500 italic clamp(22px,3.6vw,28px)/1.35 var(--display);text-wrap:balance}
  .teach .en{font-size:14px;color:var(--brown-2);font-style:italic;margin-top:8px}
  .teach .note{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-top:10px}
  .divider{width:40px;height:1px;background:var(--rule);margin:0 auto}
  .res{margin:40px auto 0;max-width:640px;text-align:center}
  .res ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}

  .prayer{max-width:600px;margin:0 auto;text-align:center;border:1px solid var(--rule);padding:36px 28px;background:var(--cream-2)}
  .prayer h3{font:500 26px/1.25 var(--display);margin:0 0 16px}
  .prayer p{margin:0}
  .lines{font-size:18px;line-height:1.9;max-width:52ch;margin-inline:auto}
  .lines p{margin:0 0 14px!important}
  .lines p:last-child{margin-bottom:0!important}
  .orig{margin-top:16px;font-size:15px;color:var(--brown-2)}
  .orig summary{cursor:pointer;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
  .orig .lines{margin-top:12px;font-size:15px;font-style:italic}
  .prayer .draft-tag{margin-top:32px;padding-top:18px;border-top:1px solid var(--rule);line-height:1.8}
  .imprimatur{font-size:13px;color:var(--brown-2);margin-top:14px!important}
  .draft-tag{font-size:13px;font-style:italic;color:var(--accent);margin-top:14px}
  .holyhour{text-align:center;max-width:56ch;margin:40px auto 0;color:var(--brown-2)}
  .holyhour strong{color:var(--brown)}

  footer{border-top:1px solid var(--rule);padding-top:24px;text-align:center;font-size:13px;color:var(--brown-2)}
  @media (max-width:420px){.unit{padding-block:10px}}
</style>
<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="hero">
    <figure class="portrait" style="margin-inline:auto">
      <img id="portrait" alt="">
    </figure>
    <p class="caption" id="caption"></p>

    <div id="hero-before">
      <div class="small" id="b-label"></div>
      <h1 id="b-title"></h1>
      <p class="sub" id="b-sub"></p>
      <div class="clock">
        <div class="unit"><div class="num" id="d">–</div><div class="lbl">ngày</div></div>
        <div class="unit"><div class="num" id="h">–</div><div class="lbl">giờ</div></div>
        <div class="unit"><div class="num" id="m">–</div><div class="lbl">phút</div></div>
        <div class="unit"><div class="num" id="s">–</div><div class="lbl">giây</div></div>
      </div>
    </div>

    <div id="hero-after" hidden>
      <div class="small" id="a-label"></div>
      <h1 id="a-title"></h1>
      <p class="sub" id="a-sub"></p>
      <div class="since"><div class="num" id="since">0</div><div class="lbl" id="a-count"></div></div>
    </div>

    <p class="date-note" id="date-note"></p>
    <p class="date-note" id="live-note" style="margin-top:4px"></p>

    <nav class="ctas" aria-label="Hành động chính">
      <a class="cta primary" href="#hoc" id="cta-learn"></a>
      <a class="cta" href="#cau-nguyen" id="cta-pray"></a>
    </nav>
  </header>

  <section id="thanh-tuu">
    <div class="head">
      <div class="small" id="g-label"></div>
      <h2 id="g-title"></h2>
      <p class="lead" id="g-lead"></p>
    </div>
    <div class="g-bar"><button class="g-back" id="g-back" type="button" hidden>Xem tất cả</button></div>
    <div class="gallery" id="gallery"></div>
  </section>

  <section id="hoc">
    <div class="head">
      <div class="small" id="t-label"></div>
      <h2 id="t-title"></h2>
      <p class="lead" id="t-lead"></p>
    </div>
    <div class="teachings" id="quotes"></div>
    <div class="res">
      <div class="small" id="r-title"></div>
      <ul id="resources"></ul>
    </div>
  </section>

  <section id="cau-nguyen">
    <div class="head">
      <div class="small" id="p-label"></div>
      <h2 id="p-title"></h2>
      <p class="lead" id="pray-lead"></p>
    </div>
    <div class="prayer">
      <h3 id="prayer-name"></h3>
      <div class="lines" id="prayer-vi"></div>
      <details class="orig" id="orig-wrap">
        <summary id="orig-title"></summary>
        <div class="lines" lang="en" id="prayer-orig"></div>
      </details>
      <p class="imprimatur" id="imprimatur"></p>
      <p class="draft-tag" id="prayer-source"></p>
    </div>
    <p class="holyhour" id="invite"></p>
  </section>

  <footer id="footer"></footer>
</div>

<script src="noi-dung.js"></script>
<script>
(function(){
  const C = window.NOI_DUNG;
  const $ = id => document.getElementById(id);
  if (!C){ document.getElementById("app").innerHTML = '<p style="padding:40px;text-align:center">Không đọc được file noi-dung.js. Kiểm tra lại dấu phẩy và dấu ngoặc kép trong file đó.</p>'; return; }
  const html = (id, v) => { const el = $(id); if (el) el.innerHTML = v || ""; };
  const lines = arr => (arr || []).map(t => "<p>" + t + "</p>").join("");

  // ---- Nội dung tĩnh ----
  document.title = C.tenTrang;
  const img = $("portrait"); img.src = C.anh.file; img.alt = C.anh.moTa;
  html("caption", C.anh.chuThich);
  html("b-label", C.truocLe.nhan); html("b-title", C.truocLe.tieuDeDong1 + "<br><em>" + C.truocLe.tieuDeDong2 + "</em>"); html("b-sub", C.truocLe.moTa);
  html("a-label", C.sauLe.nhan); html("a-title", C.sauLe.tieuDeDong1 + "<br><em>" + C.sauLe.tieuDeDong2 + "</em>"); html("a-sub", C.sauLe.moTa); html("a-count", C.sauLe.chuDemNgay);
  html("cta-learn", C.nut.hoc); html("cta-pray", C.nut.cauNguyen);
  if (C.suKien.linkTrucTiep) html("live-note", '<a href="' + C.suKien.linkTrucTiep + '" target="_blank" rel="noopener">' + C.suKien.chuLinkTrucTiep + '</a>');

  const T = C.thanhTuu;
  html("g-label", T.nhan); html("g-title", T.tieuDe); html("g-lead", T.moTa);
  $("gallery").innerHTML = T.muc.map(m =>
    '<div class="item" role="button" tabindex="0" aria-expanded="false">' +
      '<span class="year">' + m.nam + '</span><span class="t">' + m.tieuDe + '</span><span class="short">' + m.tomTat + '</span>' +
      '<div class="detail">' + lines(m.chiTiet) + '</div>' +
    '</div>').join("");

  const G = C.giaoHuan;
  html("t-label", G.nhan); html("t-title", G.tieuDe); html("t-lead", G.moTa);
  $("quotes").innerHTML = G.trichDan.map(q =>
    '<div class="teach"><blockquote>' + q.vi + '</blockquote>' + (q.goc ? '<div class="en">' + q.goc + '</div>' : '') + '<div class="note">' + (q.chuDe || '') + '</div></div>'
  ).join('<div class="divider"></div>');
  html("r-title", G.tieuDeTaiLieu);
  $("resources").innerHTML = G.taiLieu.map(r => '<li>' + (r.link ? '<a href="' + r.link + '" target="_blank" rel="noopener">' + r.ten + '</a>' : r.ten) + '</li>').join("");

  const P = C.cauNguyen;
  html("p-label", P.nhan); html("p-title", P.tieuDe); html("prayer-name", P.tenKinh);
  $("prayer-vi").innerHTML = lines(P.cauTiengViet);
  if (P.cauNguyenVan && P.cauNguyenVan.length){ html("orig-title", P.tieuDeNguyenVan); $("prayer-orig").innerHTML = lines(P.cauNguyenVan); } else $("orig-wrap").hidden = true;
  html("imprimatur", P.phepIn); html("prayer-source", P.ghiChuNguon); html("invite", P.loiMoi);
  html("footer", C.chanTrang);

  // ---- Đếm ngược ----
  const event = new Date(C.suKien.thoiGian);
  let override = location.hash === "#truoc" ? "before" : location.hash === "#sau" ? "after" : null;
  const pad = n => String(n).padStart(2, "0");
  const fmtDate = new Intl.DateTimeFormat("vi-VN", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
  const fmtTime = new Intl.DateTimeFormat("vi-VN", {hour:"2-digit", minute:"2-digit", timeZoneName:"short"});
  $("date-note").textContent = (C.suKien.daXacNhan ? "" : "Ngày dự kiến · ") + fmtDate.format(event) + ", " + fmtTime.format(event) + " (giờ của bạn) · " + C.suKien.diaDiem;

  function render(){
    const now = new Date(), m = override || (now < event ? "before" : "after");
    $("hero-before").hidden = m !== "before";
    $("hero-after").hidden = m !== "after";
    $("live-note").hidden = m !== "before" || !C.suKien.linkTrucTiep;
    if (m === "before"){
      const diff = Math.max(0, event - now) / 1000;
      $("d").textContent = Math.floor(diff / 86400);
      $("h").textContent = pad(Math.floor(diff % 86400 / 3600));
      $("m").textContent = pad(Math.floor(diff % 3600 / 60));
      $("s").textContent = pad(Math.floor(diff % 60));
    } else {
      $("since").textContent = Math.max(0, Math.floor((now - event) / 86400000));
    }
    const lead = m === "before" ? P.moTaTruocLe : P.moTaSauLe;
    if ($("pray-lead").innerHTML !== lead) $("pray-lead").innerHTML = lead;
  }

  // ---- Gallery ----
  const gal = $("gallery"), back = $("g-back");
  const items = [...gal.querySelectorAll(".item")];
  const ARROW = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2v9M3 7.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  items.forEach(i => {
    const d = i.querySelector(".detail");
    const h = document.createElement("button");
    h.type = "button"; h.className = "scroll-hint"; h.setAttribute("aria-label", "Cuộn xuống đọc tiếp");
    h.innerHTML = "<span>Cuộn để đọc tiếp</span>" + ARROW;
    h.addEventListener("click", e => { e.stopPropagation(); d.scrollBy({top: d.clientHeight * 0.7, behavior: "smooth"}); });
    d.addEventListener("scroll", () => h.classList.toggle("done", d.scrollTop + d.clientHeight >= d.scrollHeight - 6));
    i.appendChild(h);
  });
  function openItem(el){
    gal.classList.add("focus");
    items.forEach(i => { const on = i === el; i.classList.toggle("active", on); i.setAttribute("aria-expanded", String(on)); });
    const d = el.querySelector(".detail"); d.scrollTop = 0;
    const hint = el.querySelector(".scroll-hint");
    requestAnimationFrame(() => { hint.classList.toggle("done", d.scrollHeight <= d.clientHeight + 6); });
    back.hidden = false;
  }
  function closeAll(){
    gal.classList.remove("focus");
    items.forEach(i => { i.classList.remove("active"); i.setAttribute("aria-expanded","false"); });
    back.hidden = true;
  }
  items.forEach(i => {
    i.addEventListener("click", () => { if (!i.classList.contains("active")) openItem(i); });
    i.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && !i.classList.contains("active")){ e.preventDefault(); openItem(i); } });
  });
  back.onclick = closeAll;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && gal.classList.contains("focus")) closeAll(); });

  render();
  setInterval(render, 1000);
})();
</script>

</body>
</html>
